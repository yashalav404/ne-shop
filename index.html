<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NESHOP</title>
    <style>
        body {
            background-color: #0a0a0c;
            color: #ffffff;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 15px;
            -webkit-user-select: none;
        }
        
        /* Хедер */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            padding: 5px 0;
        }
        .brand-name {
            font-size: 22px;
            font-weight: 800;
            color: #deff9a;
            letter-spacing: 1px;
        }
        .back-btn {
            background: #1c1c1e;
            border: 1px solid #2c2c2e;
            color: #fff;
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
        }

        /* Экраны */
        .screen { display: none; }
        .screen.active { display: block; }

        /* Сетка игр (Главный экран) */
        .game-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }
        .game-card {
            background: #121214;
            border: 1px solid #1c1c1e;
            border-radius: 16px;
            padding: 20px 15px;
            text-align: center;
            position: relative;
            cursor: pointer;
            transition: 0.2s;
        }
        .game-card:active { transform: scale(0.97); border-color: #deff9a; }
        .game-icon { font-size: 32px; margin-bottom: 10px; }
        .game-title { font-weight: 600; font-size: 16px; }
        
        .badge-soon {
            position: absolute;
            top: 8px; right: 8px;
            background: rgba(222, 255, 154, 0.1);
            color: #deff9a;
            border: 1px solid rgba(222, 255, 154, 0.3);
            font-size: 10px;
            padding: 3px 6px;
            border-radius: 6px;
            text-transform: uppercase;
            font-weight: 700;
        }

        /* Табы (Внутри игры) */
        .tabs {
            display: flex;
            background: #121214;
            padding: 4px;
            border-radius: 10px;
            margin-bottom: 20px;
            border: 1px solid #1c1c1e;
        }
        .tab {
            flex: 1; text-align: center; padding: 10px; border-radius: 8px;
            font-weight: 600; font-size: 14px; cursor: pointer;
        }
        .tab.active { background: #deff9a; color: #000; }

        /* Товары */
        .product-list {
            display: flex; flex-direction: column; gap: 12px;
        }
        .product-item {
            background: #121214;
            border: 1px solid #1c1c1e;
            border-radius: 12px;
            padding: 16px;
            display: flex; justify-content: space-between; align-items: center;
            cursor: pointer;
        }
        .product-item:active { border-color: #deff9a; }
        .product-name { font-weight: 600; font-size: 16px; }
        .product-price { color: #deff9a; font-weight: 700; font-size: 16px; }

        /* Экран заказа */
        .order-box {
            background: #121214; border: 1px solid #1c1c1e;
            border-radius: 16px; padding: 20px; margin-bottom: 20px;
        }
        input {
            width: 100%; padding: 14px; background: #1c1c1e;
            border: 1px solid #2c2c2e; border-radius: 10px;
            color: #fff; font-size: 16px; box-sizing: border-box; margin-top: 10px;
        }
        input:focus { border-color: #deff9a; outline: none; }
        
        .main-btn {
            width: 100%; padding: 16px; background: #deff9a;
            border: none; border-radius: 10px; color: #000;
            font-size: 16px; font-weight: 700; cursor: pointer; margin-top: 15px;
        }
        .sbp-btn {
            width: 100%; padding: 16px; background: #0054ae;
            border: none; border-radius: 10px; color: #fff;
            font-size: 16px; font-weight: 700; cursor: pointer;
            margin-top: 15px; display: none; text-align: center;
        }
        .nickname-display {
            margin-top: 15px; padding: 12px; background: rgba(222, 255, 154, 0.1);
            border: 1px dashed #deff9a; border-radius: 8px;
            color: #deff9a; font-weight: 600; text-align: center; display: none;
        }

        /* Стиль для экрана СКОРО по центру */
        .soon-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 60vh;
            text-align: center;
        }
        .soon-title {
            font-size: 26px;
            font-weight: 800;
            color: #deff9a;
            margin-bottom: 10px;
        }
        .soon-subtitle {
            font-size: 16px;
            color: #8e8e93;
        }
    </style>
</head>
<body>

    <div id="screen-main" class="screen active">
        <div class="header">
            <div class="brand-name">NESHOP</div>
        </div>
        <div class="game-grid">
            <div class="game-card" onclick="openGame('pubg')">
                <div class="game-icon">🔫</div>
                <div class="game-title">PUBG Mobile</div>
            </div>
            <div class="game-card" onclick="openSoon('Steam', 'screen-main')">
                <div class="badge-soon">скоро</div>
                <div class="game-icon">🎮</div>
                <div class="game-title">Steam</div>
            </div>
            <div class="game-card" onclick="openSoon('PS Store', 'screen-main')">
                <div class="badge-soon">скоро</div>
                <div class="game-icon">🕹️</div>
                <div class="game-title">PS Store</div>
            </div>
            <div class="game-card" onclick="openSoon('TG Stars', 'screen-main')">
                <div class="badge-soon">скоро</div>
                <div class="game-icon">⭐</div>
                <div class="game-title">TG Stars</div>
            </div>
        </div>
    </div>

    <div id="screen-pubg" class="screen">
        <div class="header">
            <button class="back-btn" onclick="openScreen('screen-main')">⬅ Все игры</button>
            <div class="brand-name">NESHOP</div>
        </div>
        <div class="tabs">
            <div class="tab active">UC</div>
            <div class="tab" onclick="openSoon('PUBG KEY', 'screen-pubg')" style="color: #8e8e93;">
                KEY <span style="font-size:10px; background: rgba(222,255,154,0.1); color:#deff9a; padding: 2px 4px; border-radius:4px; margin-left:3px;">СКОРО</span>
            </div>
        </div>
        <div class="product-list">
            <div class="product-item" onclick="selectProduct('60 UC', 65)">
                <div class="product-name">🎫 60 UC</div>
                <div class="product-price">65 ₽</div>
            </div>
            <div class="product-item" onclick="selectProduct('660 UC', 650)">
                <div class="product-name">🎁 660 UC</div>
                <div class="product-price">650 ₽</div>
            </div>
        </div>
    </div>

    <div id="screen-order" class="screen">
        <div class="header">
            <button class="back-btn" onclick="openScreen('screen-pubg')">⬅ Назад</button>
            <div class="brand-name">NESHOP</div>
        </div>
        <div class="order-box">
            <div style="font-size: 14px; color: #8e8e93;">Ваш заказ:</div>
            <div id="order-details" style="font-size: 20px; font-weight: 700; margin-top: 5px; color: #deff9a;"></div>
        </div>
        <div class="order-box">
            <label style="font-size: 14px; color: #8e8e93;">Введите PUBG ID:</label>
            <input type="number" id="pubg-id" placeholder="Например: 512345678">
            <button class="main-btn" id="check-btn" onclick="verifyPlayerId()">Проверить ID</button>
            <div id="nickname-output" class="nickname-display"></div>
        </div>
        <button class="sbp-btn" id="pay-btn" onclick="confirmPayment()">Оплатить через СБП</button>
    </div>

    <div id="screen-soon" class="screen">
        <div class="header">
            <button class="back-btn" id="soon-back-btn" onclick="openScreen('screen-main')">⬅ Назад</button>
            <div class="brand-name">NESHOP</div>
        </div>
        <div class="soon-container">
            <div id="soon-section-name" class="soon-title">РАЗДЕЛ</div>
            <div class="soon-subtitle">⏳ Находится в разработке.<br>Совсем скоро этот продукт будет доступен!</div>
        </div>
    </div>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        let selectedItem = "";
        let selectedPrice = 0;

        function openScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        function openGame(game) {
            if(game === 'pubg') openScreen('screen-pubg');
        }

        // Логика открытия экрана "Скоро"
        function openSoon(sectionName, fromScreen) {
            // Меняем текст по центру на название раздела
            document.getElementById('soon-section-name').innerText = sectionName.toUpperCase();
            
            # Настраиваем кнопку назад, чтобы возвращала на правильный экран
            document.getElementById('soon-back-btn').setAttribute("onclick", `openScreen('${fromScreen}')`);
            
            openScreen('screen-soon');
        }

        function selectProduct(name, price) {
            selectedItem = name;
            selectedPrice = price;
            document.getElementById('order-details').innerText = `${name} — ${price} ₽`;
            
            document.getElementById('pubg-id').value = "";
            document.getElementById('nickname-output').style.display = "none";
            document.getElementById('pay-btn').style.display = "none";
            
            openScreen('screen-order');
        }

        function verifyPlayerId() {
            const idValue = document.getElementById('pubg-id').value;
            if(!idValue) {
                alert("Введите ваш ID аккаунта!");
                return;
            }

            document.getElementById('nickname-output').innerText = "Аккаунт найден: 👑 NESHOP_PLAYER 👑";
            document.getElementById('nickname-output').style.display = "block";
            document.getElementById('pay-btn').style.display = "block";
        }

        function confirmPayment() {
            const idValue = document.getElementById('pubg-id').value;
            const orderData = {
                action: "initiate_payment",
                game: "pubg_mobile",
                item: selectedItem,
                price: selectedPrice,
                player_id: idValue
            };
            tg.sendData(JSON.stringify(orderData));
            tg.close();
        }
    </script>
</body>
</html>
