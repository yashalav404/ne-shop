<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NE SHOP</title>
    <style>
        body {
            background-color: #0b0a0f;
            color: #ffffff;
            font-family: 'Segoe UI', Roboto, Helvetica, sans-serif;
            margin: 0;
            padding: 12px;
            -webkit-user-select: none;
        }

        /* ИСПРАВЛЕННЫЙ БАННЕР: пропорции 2:1 под твою картинку 1200х600 */
        .top-banner {
            width: 100%;
            aspect-ratio: 2 / 1; /* Автоматически держит пропорции картинки 1200x600 */
            background-image: url('https://yashalav404.github.io/ne-shop/top-banner.png');
            background-size: cover;
            background-position: center;
            border: 1px solid #251f38;
            border-radius: 20px;
            margin-bottom: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 15px;
        }
        .back-btn {
            background: #1b1924;
            border: 1px solid #2d2a3a;
            color: #fff;
            padding: 10px 16px;
            border-radius: 12px;
            font-size: 14px;
            cursor: pointer;
            font-weight: 600;
        }

        /* Экраны */
        .screen { display: none; }
        .screen.active { display: block; }

        /* СЕТКА БАННЕРОВ NE */
        .banner-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .category-card {
            width: 100%;
            height: 105px;
            border-radius: 18px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            background-size: cover;
            background-position: center;
            position: relative;
            cursor: pointer;
            overflow: hidden;
            display: flex;
            align-items: flex-end;
            padding: 15px;
            box-sizing: border-box;
            text-align: left;
            transition: transform 0.2s;
            color: #fff;
            font-family: inherit;
        }
        .category-card:active { transform: scale(0.98); }
        
        .category-card::after {
            content: ''; position: absolute; top:0; left:0; right:0; bottom:0;
            background: linear-gradient(to top, rgba(0,0,0,0.85) 20%, rgba(0,0,0,0.2) 100%);
            z-index: 1;
        }
        .category-title {
            position: relative;
            z-index: 2;
            font-weight: 700;
            font-size: 16px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        /* Подключение твоих картинок для плашек */
        .bg-pubg { background-image: url('https://yashalav404.github.io/ne-shop/bg-pubg.png'); }
        .bg-steam { background-image: url('https://yashalav404.github.io/ne-shop/bg-steam.png'); }
        .bg-stars { background-image: url('https://yashalav404.github.io/ne-shop/bg-stars.png'); }

        .badge-soon {
            position: absolute;
            top: 12px; right: 12px;
            background: rgba(222, 255, 154, 0.15);
            color: #deff9a;
            border: 1px solid rgba(222, 255, 154, 0.4);
            font-size: 9px;
            padding: 3px 6px;
            border-radius: 6px;
            font-weight: 800;
            letter-spacing: 0.5px;
            z-index: 2;
        }

        /* Табы и товары */
        .tabs { display: flex; background: #13111c; padding: 4px; border-radius: 12px; margin-bottom: 15px; border: 1px solid #201b2e; }
        .tab { flex: 1; text-align: center; padding: 12px; border-radius: 9px; font-weight: 700; font-size: 14px; cursor: pointer; }
        .tab.active { background: #deff9a; color: #000; }
